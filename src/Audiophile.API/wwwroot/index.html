<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audiophile · Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="bar">
    <a class="logo" href="/">audiophile</a>
    <nav class="links">
      <a href="/" aria-current="page">Shop</a>
      <a href="/orders.html">My orders</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">Payment demo</div>
    <h1>Shop</h1>
    <p class="muted">Add something to the cart, choose how to pay, and place the order. Card and Fawry go through the payment gateway; cash on delivery confirms immediately.</p>

    <div class="layout">
      <section>
        <div class="products" id="products"><p class="muted">Loading products…</p></div>
      </section>

      <aside class="card" aria-labelledby="cart-title">
        <h2 id="cart-title">Cart</h2>
        <div id="cart"></div>

        <form id="checkout" hidden>
          <fieldset>
            <legend>Shipping</legend>
            <div class="field"><label for="fullName">Full name</label><input id="fullName" required value="Mona Hassan"></div>
            <div class="field"><label for="phone">Phone</label><input id="phone" required value="+201000000000"></div>
            <div class="field"><label for="street">Street</label><input id="street" required value="12 Tahrir Street"></div>
            <div class="field"><label for="city">City</label><input id="city" required value="Cairo"></div>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <div class="methods">
              <label class="method"><input type="radio" name="method" value="Card" checked>
                <span>Card<small>Visa, Mastercard, Meeza on the gateway's secure page</small></span></label>
              <label class="method"><input type="radio" name="method" value="Kiosk">
                <span>Fawry / cash outlet<small>Get a code, pay cash at any outlet within 48 hours</small></span></label>
              <label class="method"><input type="radio" name="method" value="VodafoneCash">
                <span>Mobile wallet<small>Vodafone Cash and other wallets</small></span></label>
              <label class="method"><input type="radio" name="method" value="CashOnDelivery">
                <span>Cash on delivery<small>No gateway; pay the courier</small></span></label>
            </div>
          </fieldset>

          <div id="error" class="notice bad" hidden></div>
          <button class="btn" id="place" type="submit" style="width:100%;margin-top:16px">Place order</button>
        </form>
      </aside>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    let products = [];
    let cart = Store.get("audiophile-cart", {});          // { productId: quantity }
    // One key per checkout attempt. A double click or a network retry reuses it,
    // so the server returns the same order instead of creating a second one.
    let idempotencyKey = Store.get("audiophile-checkout-key", null) || newKey();

    function newKey() {
      const key = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
      Store.set("audiophile-checkout-key", key);
      return key;
    }

    function saveCart() { Store.set("audiophile-cart", cart); renderCart(); }

    function renderProducts() {
      document.getElementById("products").innerHTML = products.map((p) => `
        <article class="card product">
          <div class="art" aria-hidden="true">${escapeHtml(p.name.split(" ")[0])}</div>
          <h3>${escapeHtml(p.name)}</h3>
          <div class="price">${money(p.price)}</div>
          <div class="stock">${p.stock > 0 ? `${p.stock} in stock` : "Out of stock"}</div>
          <button class="btn small" data-add="${p.id}" ${p.stock > 0 ? "" : "disabled"}>Add to cart</button>
        </article>`).join("");
    }

    function renderCart() {
      const lines = Object.entries(cart)
        .map(([id, qty]) => ({ product: products.find((p) => p.id === id), qty }))
        .filter((l) => l.product);

      const form = document.getElementById("checkout");
      if (lines.length === 0) {
        document.getElementById("cart").innerHTML = `<p class="muted">Your cart is empty.</p>`;
        form.hidden = true;
        return;
      }

      const subTotal = lines.reduce((sum, l) => sum + l.product.price * l.qty, 0);
      const shipping = shippingFor(subTotal);
      document.getElementById("cart").innerHTML = lines.map((l) => `
        <div class="cart-line">
          <strong>${escapeHtml(l.product.name)}</strong>
          <span class="price">${money(l.product.price * l.qty)}</span>
          <span class="qty">
            <button type="button" data-dec="${l.product.id}" aria-label="Decrease">−</button>
            <span>${l.qty}</span>
            <button type="button" data-inc="${l.product.id}" aria-label="Increase">+</button>
          </span>
        </div>`).join("") + `
        <div class="totals">
          <span class="muted">Subtotal</span><span>${money(subTotal)}</span>
          <span class="muted">Shipping</span><span>${shipping ? money(shipping) : "Free"}</span>
          <span class="grand">Total</span><span class="grand">${money(subTotal + shipping)}</span>
        </div>`;
      form.hidden = false;
    }

    document.addEventListener("click", (e) => {
      const add = e.target.closest("[data-add]")?.dataset.add;
      const inc = e.target.closest("[data-inc]")?.dataset.inc;
      const dec = e.target.closest("[data-dec]")?.dataset.dec;
      if (add) cart[add] = (cart[add] || 0) + 1;
      if (inc) cart[inc] += 1;
      if (dec) { cart[dec] -= 1; if (cart[dec] <= 0) delete cart[dec]; }
      if (add || inc || dec) saveCart();
    });

    document.getElementById("checkout").addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = document.getElementById("place");
      const error = document.getElementById("error");
      error.hidden = true;
      button.disabled = true;
      button.textContent = "Placing order…";

      const value = (id) => document.getElementById(id).value.trim();
      const body = {
        items: Object.entries(cart).map(([productId, quantity]) => ({ productId, quantity })),
        paymentMethod: document.querySelector("input[name=method]:checked").value,
        shipping: {
          fullName: value("fullName"), phone: value("phone"), street: value("street"),
          city: value("city"), country: "Egypt", postalCode: null,
        },
      };

      try {
        const order = await Api.placeOrder(body, idempotencyKey);
        cart = {};
        saveCart();
        idempotencyKey = newKey();                          // the next checkout gets a fresh key

        // Gateway methods: go to the gateway's hosted page. It sends the customer
        // back to /payments/fawaterak/return, which forwards to My orders.
        if (order.payment?.checkoutUrl) {
          window.location.href = order.payment.checkoutUrl;
        } else {
          window.location.href = `/orders.html?id=${order.id}&result=success`;
        }
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
        button.disabled = false;
        button.textContent = "Place order";
      }
    });

    Api.products()
      .then((list) => { products = list; renderProducts(); renderCart(); })
      .catch((err) => {
        document.getElementById("products").innerHTML = `<div class="notice bad">${escapeHtml(err.message)}</div>`;
      });
  </script>
</body>
</html>
