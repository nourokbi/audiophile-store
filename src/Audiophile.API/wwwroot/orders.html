<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audiophile · My orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="bar">
    <a class="logo" href="/">audiophile</a>
    <nav class="links">
      <a href="/">Shop</a>
      <a href="/orders.html" aria-current="page">My orders</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">Order status</div>
    <h1>My orders</h1>
    <div id="banner" aria-live="polite"></div>
    <div class="orders" id="orders"><p class="muted">Loading orders…</p></div>
  </main>

  <script src="/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const focusId = params.get("id");
    const result = params.get("result");          // success | fail | pending — a hint from the redirect, never trusted
    const startedAt = Date.now();
    let timer = null;

    // The banner is decided by OUR record of the order. The redirect's "result" only
    // picks the wording while we wait for the webhook to confirm.
    function bannerFor(order) {
      if (!order) return "";
      const p = order.payment;
      const waited = Date.now() - startedAt;

      if (order.status === "Cancelled") {
        return banner("bad", "Order cancelled", "This order was cancelled and you have not been charged. Stock has been released.",
          `<a class="btn small ghost" href="/">Back to shop</a>`);
      }
      if (order.status !== "Pending") {
        return banner("ok", "Payment received",
          `Order ${short(order.id)} is <b>${escapeHtml(order.status)}</b>. ${order.paymentMethod === "CashOnDelivery"
            ? "Pay the courier on delivery." : `We received ${money(p?.amount ?? order.totalAmount)}.`}`,
          `<a class="btn small ghost" href="/">Continue shopping</a>`);
      }
      if (p?.paymentCode) {
        return banner("warn", "Pay at any Fawry outlet",
          `Quote this code and pay <b>${money(order.totalAmount)}</b> within 48 hours. Your order is reserved until then.
           <div><span class="code-box">${escapeHtml(p.paymentCode)}</span></div>`,
          p.checkoutUrl ? `<a class="btn small ghost" href="${escapeHtml(p.checkoutUrl)}">Show payment page</a>` : "");
      }
      if (result === "fail") {
        return banner("bad", "Payment didn't go through",
          "Nothing was charged. Your order is still reserved, so you can try again with another card.",
          p?.checkoutUrl ? `<a class="btn small" href="${escapeHtml(p.checkoutUrl)}">Try again</a>` : "");
      }
      if (result === "success") {
        return banner("info",
          `<span class="spinner"></span> Confirming your payment`,
          waited < 30000
            ? "The payment gateway is notifying us. This usually takes a few seconds."
            : "This is taking longer than usual. We can ask the gateway directly.",
          waited < 30000 ? "" : `<button class="btn small" data-sync="${order.id}">Check with the gateway</button>`);
      }
      return banner("warn", "Waiting for payment", "This order has not been paid yet.",
        p?.checkoutUrl ? `<a class="btn small" href="${escapeHtml(p.checkoutUrl)}">Pay now</a>` : "");
    }

    function banner(tone, title, text, actions = "") {
      return `<div class="banner ${tone}"><h2>${title}</h2><div>${text}</div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;
    }

    const short = (id) => `#${id.slice(0, 8).toUpperCase()}`;

    function renderOrder(o) {
      const p = o.payment;
      const items = o.items.map((i) => `${i.quantity} × ${escapeHtml(i.productName)}`).join(", ");
      const canPay = o.status === "Pending" && p?.checkoutUrl;
      const canSync = o.status === "Pending" && p?.provider;
      return `
        <article class="order ${o.id === focusId ? "highlight" : ""}" id="order-${o.id}">
          <div class="order-head">
            <div class="pills">
              <strong>${short(o.id)}</strong>
              ${pill(o.status, ORDER_TONE[o.status] || "info")}
              ${p ? pill(`Payment: ${p.status}`, PAYMENT_TONE[p.status] || "info") : ""}
            </div>
            <span class="order-id">${new Date(o.createdAt).toLocaleString()}</span>
          </div>
          <div>${items}</div>
          <div class="order-meta">
            <span>Total <b>${money(o.totalAmount)}</b></span>
            <span>Method <b>${escapeHtml(METHOD_LABELS[o.paymentMethod] || o.paymentMethod)}</b></span>
            ${p?.provider ? `<span>Gateway <b>${escapeHtml(p.provider)}</b></span>` : ""}
            ${p?.providerOrderId ? `<span>Gateway ref <b>${escapeHtml(p.providerOrderId)}</b></span>` : ""}
            ${p?.paymentCode ? `<span>Payment code <b>${escapeHtml(p.paymentCode)}</b></span>` : ""}
            ${p?.refundedAmount > 0 ? `<span>Refunded <b>${money(p.refundedAmount)}</b></span>` : ""}
          </div>
          ${canPay || canSync ? `<div class="order-actions">
            ${canPay ? `<a class="btn small" href="${escapeHtml(p.checkoutUrl)}">Pay now</a>` : ""}
            ${canSync ? `<button class="btn small ghost" data-sync="${o.id}">Check with the gateway</button>` : ""}
          </div>` : ""}
        </article>`;
    }

    async function load() {
      try {
        const orders = await Api.orders();
        const focus = orders.find((o) => o.id === focusId);
        document.getElementById("banner").innerHTML = bannerFor(focus);
        document.getElementById("orders").innerHTML = orders.length
          ? orders.map(renderOrder).join("")
          : `<div class="card empty"><p class="muted">No orders yet.</p><a class="btn" href="/">Go shopping</a></div>`;

        // Keep refreshing while the focused order waits for its webhook (up to 2 minutes).
        clearTimeout(timer);
        if (focus && focus.status === "Pending" && Date.now() - startedAt < 120000) {
          timer = setTimeout(load, 3000);
        }
      } catch (err) {
        document.getElementById("orders").innerHTML = `<div class="notice bad">${escapeHtml(err.message)}</div>`;
      }
    }

    document.addEventListener("click", async (e) => {
      const id = e.target.closest("[data-sync]")?.dataset.sync;
      if (!id) return;
      e.target.disabled = true;
      e.target.textContent = "Checking…";
      try { await Api.sync(id); } catch (err) { alertInline(err.message); }
      load();
    });

    function alertInline(message) {
      document.getElementById("banner").insertAdjacentHTML("afterbegin",
        `<div class="notice bad">${escapeHtml(message)}</div>`);
    }

    load().then(() => {
      if (focusId) document.getElementById(`order-${focusId}`)?.scrollIntoView({ block: "center" });
    });
  </script>
</body>
</html>
