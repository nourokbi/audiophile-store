# Serves the built shop and does the Vite proxy's job, so the browser only ever talks to one address
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/products goes to the API as /products
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API scopes the refresh cookie to /auth, the browser sees that path as /api/auth
        proxy_cookie_path /auth /api/auth;
    }

    # Fawaterak's webhook and return redirect keep their path
    location /payments/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Any other address is a page of the React app
    location / {
        try_files $uri /index.html;
    }
}
